<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Spline+Sans+Mono:wght@400;500;600;700&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ════════════════════════════════════════════════════════════
       MangaLens — Risograph Comic Print theme
       Warm paper · heavy ink · red+blue spot color · halftone
       ════════════════════════════════════════════════════════════ */
    :root {
      --paper:    #f2ebdc;
      --paper-2:  #e9dfca;
      --ink:      #17120c;
      --ink-soft: #6a5e4d;
      --red:      #e8391a;
      --blue:     #1f3fd1;
      --yellow:   #f4c233;
      --green:    #1f9d4d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 360px;
      min-height: 400px;
      font-family: 'Spline Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      position: relative;
      overflow-x: hidden;
    }

    /* ── Halftone dot texture (red, low opacity) ─────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(232,57,26,0.14) 1.1px, transparent 1.4px);
      background-size: 7px 7px;
      pointer-events: none;
      z-index: 0;
    }
    /* ── Paper grain (subtle ink speckle) ────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(23,18,12,0.05) 0.5px, transparent 0.6px);
      background-size: 3px 3px;
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: multiply;
    }

    /* ════════ HEADER — comic masthead panel ════════ */
    .header {
      position: relative;
      z-index: 2;
      padding: 22px 20px 20px;
      background: var(--ink);
      color: var(--paper);
      border-bottom: 3px solid var(--ink);
      overflow: hidden;
    }
    /* white halftone burst behind title */
    .header::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -10%;
      width: 180px;
      height: 200%;
      background-image: radial-gradient(circle, rgba(242,235,220,0.16) 1.4px, transparent 1.7px);
      background-size: 8px 8px;
      transform: rotate(8deg);
      pointer-events: none;
    }

    .header-content {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    /* Square ink stamp with offset red shadow */
    .logo-mark {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      background: var(--red);
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Anton', sans-serif;
      font-size: 26px;
      border: 2.5px solid var(--paper);
      box-shadow: 4px 4px 0 var(--blue);
      transform: rotate(-4deg);
    }

    .header-text h1 {
      font-family: 'Anton', sans-serif;
      font-size: 31px;
      font-weight: 400;
      letter-spacing: 1.5px;
      line-height: 0.92;
      text-transform: uppercase;
      /* misregistration / chromatic misprint */
      text-shadow: 2px 0 0 var(--red), -2px 0 0 var(--blue);
    }

    .header-text .tagline {
      font-family: 'Spline Sans Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      color: var(--yellow);
      letter-spacing: 3.5px;
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* ════════ CONTENT ════════ */
    .content {
      position: relative;
      z-index: 1;
      padding: 18px 18px 20px;
    }

    /* ── Status readout (OCR scanner strip) ─────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--paper-2);
      border: 2.5px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      margin-bottom: 18px;
    }

    .status-indicator { position: relative; width: 11px; height: 11px; flex-shrink: 0; }

    .status-dot {
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--ink-soft);
      border: 1.5px solid var(--ink);
    }
    .status-dot.connected { background: var(--green); }
    .status-dot.connected::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1.5px solid var(--green);
      animation: pulse-ring 1.8s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.7); opacity: 1; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    .status-text {
      font-family: 'Spline Sans Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    /* ── Progress ───────────────────────────────────────────── */
    .progress-section {
      display: none;
      margin-bottom: 16px;
      animation: panelIn 0.3s cubic-bezier(0.34,1.4,0.64,1);
    }
    .progress-section.active { display: block; }

    .progress-track {
      height: 14px;
      background: var(--paper-2);
      border: 2.5px solid var(--ink);
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--red);
      background-image: repeating-linear-gradient(
        -45deg, transparent, transparent 5px,
        rgba(23,18,12,0.18) 5px, rgba(23,18,12,0.18) 10px);
      transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
      border-right: 2.5px solid var(--ink);
    }
    .progress-label {
      font-family: 'Spline Sans Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-top: 7px;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── Buttons (comic action panels) ──────────────────────── */
    .btn-stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }

    .btn {
      width: 100%;
      padding: 13px 16px;
      border: 2.5px solid var(--ink);
      font-family: 'Anton', sans-serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease, color 0.15s ease;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: 2px 2px 0 var(--ink) !important; transform: none !important; }

    /* press-into-paper interaction: button slides onto its own shadow */
    .btn-translate {
      background: var(--red);
      color: var(--paper);
      box-shadow: 5px 5px 0 var(--ink);
    }
    .btn-translate:hover:not(:disabled) { background: #ff4422; transform: translate(2px,2px); box-shadow: 3px 3px 0 var(--ink); }
    .btn-translate:active:not(:disabled) { transform: translate(5px,5px); box-shadow: 0 0 0 var(--ink); }

    .btn-clear {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      font-size: 14px;
    }
    .btn-clear:hover:not(:disabled) { background: var(--yellow); transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
    .btn-clear:active:not(:disabled) { transform: translate(4px,4px); box-shadow: 0 0 0 var(--ink); }

    .btn-settings {
      background: var(--blue);
      color: var(--paper);
      box-shadow: 4px 4px 0 var(--ink);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }
    .btn-settings:hover:not(:disabled) { background: #2c4ff0; transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
    .btn-settings:active:not(:disabled) { transform: translate(4px,4px); box-shadow: 0 0 0 var(--ink); }
    .btn-settings .gear-icon { width: 16px; height: 16px; transition: transform 0.5s cubic-bezier(0.34,1.4,0.64,1); }
    .btn-settings:hover:not(:disabled) .gear-icon { transform: rotate(180deg); }

    /* ── Divider: torn-tape ink rule ────────────────────────── */
    .divider {
      height: 3px;
      background: var(--ink);
      margin: 4px 0 16px;
      position: relative;
    }
    .divider::after {
      content: 'スキャン';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--paper);
      padding: 0 8px;
      font-family: 'Spline Sans Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--ink-soft);
    }

    /* ── Info cards (count panels) ──────────────────────────── */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .info-card {
      padding: 12px 14px;
      background: var(--paper-2);
      border: 2.5px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      position: relative;
      overflow: hidden;
    }
    .info-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(31,63,209,0.12) 1px, transparent 1.3px);
      background-size: 6px 6px;
      pointer-events: none;
    }
    .info-label {
      position: relative;
      font-family: 'Spline Sans Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 2px;
    }
    .info-value {
      position: relative;
      font-family: 'Anton', sans-serif;
      font-size: 30px;
      line-height: 1;
      color: var(--red);
    }
    .info-value.muted { color: var(--ink-soft); }
    .info-card:nth-child(2) .info-value { color: var(--blue); }

    /* ── Bottom registration bar ────────────────────────────── */
    .bottom-edge {
      height: 8px;
      background: repeating-linear-gradient(90deg,
        var(--red) 0 16px, var(--ink) 16px 20px,
        var(--blue) 20px 36px, var(--ink) 36px 40px,
        var(--yellow) 40px 56px, var(--ink) 56px 60px);
    }

    /* ── Load orchestration ─────────────────────────────────── */
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .header      { animation: panelIn 0.35s cubic-bezier(0.34,1.4,0.64,1) both; }
    .status-bar  { animation: panelIn 0.4s cubic-bezier(0.34,1.4,0.64,1) 0.06s both; }
    .btn-stack   { animation: panelIn 0.4s cubic-bezier(0.34,1.4,0.64,1) 0.12s both; }
    .divider     { animation: panelIn 0.4s ease 0.18s both; }
    .info-grid   { animation: panelIn 0.4s cubic-bezier(0.34,1.4,0.64,1) 0.22s both; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div class="logo-mark">M</div>
      <div class="header-text">
        <h1>MangaLens</h1>
        <div class="tagline">Webtoon&nbsp;Translator</div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="status-bar">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
      </div>
      <span class="status-text" id="statusText">No provider configured</span>
    </div>

    <div class="progress-section" id="progressSection">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressText">Initializing...</div>
    </div>

    <div class="btn-stack">
      <button class="btn btn-translate" id="translateBtn" disabled>Translate Chapter</button>
      <button class="btn btn-clear" id="clearBtn" style="display:none;">Clear Translations</button>
      <button class="btn btn-settings" id="settingsBtn">
        <svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        Settings
      </button>
    </div>

    <div class="divider"></div>

    <div class="info-grid">
      <div class="info-card">
        <div class="info-label">Panels</div>
        <div class="info-value" id="imageCount">—</div>
      </div>
      <div class="info-card">
        <div class="info-label">Translated</div>
        <div class="info-value" id="translatedCount">0</div>
      </div>
    </div>
  </div>

  <div class="bottom-edge"></div>

  <script src="popup.js"></script>
</body>
</html>
