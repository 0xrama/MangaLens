<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Spline+Sans+Mono:wght@400;500;600;700&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ════════════════════════════════════════════════════════════
       MangaLens Settings — Risograph Comic Print theme
       ════════════════════════════════════════════════════════════ */
    :root {
      --paper:    #f2ebdc;
      --paper-2:  #e9dfca;
      --ink:      #17120c;
      --ink-soft: #6a5e4d;
      --red:      #e8391a;
      --blue:     #1f3fd1;
      --yellow:   #f4c233;
      --green:    #1f9d4d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Spline Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* halftone + grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(232,57,26,0.12) 1.1px, transparent 1.4px);
      background-size: 8px 8px;
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(23,18,12,0.045) 0.5px, transparent 0.6px);
      background-size: 3px 3px;
      pointer-events: none; z-index: 0;
      mix-blend-mode: multiply;
    }

    /* diagonal blue speed-line band */
    .bg-lines {
      position: fixed; inset: 0;
      overflow: hidden; pointer-events: none; z-index: 0;
    }
    .bg-lines::before {
      content: '';
      position: absolute;
      top: -40%; right: -15%;
      width: 360px; height: 180%;
      background: repeating-linear-gradient(
        18deg, transparent, transparent 46px,
        rgba(31,63,209,0.04) 46px, rgba(31,63,209,0.04) 48px);
    }

    .page {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      padding: 56px 20px 70px;
      min-height: 100vh;
    }

    /* ════════ HEADER ════════ */
    .page-header {
      text-align: center;
      margin-bottom: 40px;
      animation: dropIn 0.5s cubic-bezier(0.34,1.4,0.64,1) both;
    }
    .logo-group {
      display: flex; align-items: center; justify-content: center;
      gap: 18px; margin-bottom: 14px;
    }
    .logo-stamp {
      width: 60px; height: 60px;
      flex-shrink: 0;
      background: var(--red);
      color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif;
      font-size: 38px;
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--blue);
      transform: rotate(-5deg);
    }
    .page-title {
      font-family: 'Anton', sans-serif;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 0.9;
      text-shadow: 3px 0 0 var(--red), -3px 0 0 var(--blue);
    }
    .page-subtitle {
      font-family: 'Spline Sans Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-soft);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 12px;
    }

    /* ════════ CARD ════════ */
    .settings-card {
      background: var(--paper-2);
      border: 3px solid var(--ink);
      box-shadow: 10px 10px 0 var(--ink);
      max-width: 540px;
      width: 100%;
      animation: dropIn 0.55s cubic-bezier(0.34,1.4,0.64,1) 0.12s both;
    }

    .setting-section {
      padding: 26px 30px;
      border-bottom: 3px solid var(--ink);
    }
    .setting-section:last-of-type { padding-bottom: 30px; }

    .section-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px;
    }
    .section-num {
      width: 30px; height: 30px;
      flex-shrink: 0;
      background: var(--ink);
      color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Anton', sans-serif;
      font-size: 17px;
    }
    .section-label {
      font-family: 'Anton', sans-serif;
      font-size: 21px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .section-jp {
      font-family: 'Spline Sans Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      color: var(--red);
      letter-spacing: 2px;
      margin-left: auto;
    }

    /* ── Fields ─────────────────────────────────────────────── */
    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    label {
      display: block;
      font-family: 'Spline Sans Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    input[type="password"], select {
      width: 100%;
      padding: 12px 14px;
      background: var(--paper);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      font-family: 'Spline Sans Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      outline: none;
      transition: box-shadow 0.12s ease, transform 0.12s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="password"]:focus, select:focus {
      box-shadow: 4px 4px 0 var(--red);
      transform: translate(-1px,-1px);
    }
    input[type="password"]::placeholder { color: #b3a78f; }

    select {
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5l5 5 5-5' stroke='%2317120c' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 13px center;
      padding-right: 36px;
    }
    select:focus { box-shadow: 4px 4px 0 var(--blue); }
    select option { background: var(--paper); color: var(--ink); }

    .field-hint {
      font-family: 'Spline Sans Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      margin-top: 8px;
      line-height: 1.5;
    }
    .field-hint a {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
      box-shadow: inset 0 -2px 0 var(--red);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .field-hint a:hover { background: var(--red); color: var(--paper); }

    /* ── Save bar ───────────────────────────────────────────── */
    .save-section {
      padding: 24px 30px;
      background: var(--ink);
      display: flex; align-items: center; gap: 18px;
    }
    .btn-save {
      padding: 13px 34px;
      background: var(--red);
      color: var(--paper);
      border: 2.5px solid var(--paper);
      font-family: 'Anton', sans-serif;
      font-size: 16px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 5px 5px 0 var(--blue);
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    }
    .btn-save:hover { background: #ff4422; transform: translate(2px,2px); box-shadow: 3px 3px 0 var(--blue); }
    .btn-save:active { transform: translate(5px,5px); box-shadow: 0 0 0 var(--blue); }

    .saved-toast {
      display: none;
      align-items: center; gap: 8px;
      font-family: 'Spline Sans Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--paper);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .saved-toast.show { display: flex; animation: stamp 0.35s cubic-bezier(0.34,1.6,0.64,1); }
    @keyframes stamp {
      0%   { opacity: 0; transform: scale(1.5) rotate(-6deg); }
      60%  { opacity: 1; transform: scale(0.95) rotate(-6deg); }
      100% { opacity: 1; transform: scale(1) rotate(-6deg); }
    }
    .saved-toast { transform: rotate(-6deg); }
    .saved-toast .check-mark {
      width: 20px; height: 20px;
      background: var(--green);
      color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      border: 1.5px solid var(--paper);
    }

    .page-footer {
      margin-top: 36px;
      text-align: center;
      font-family: 'Spline Sans Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--ink-soft);
      text-transform: uppercase;
    }
    .page-footer span { color: var(--red); }

    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-lines"></div>

  <div class="page">
    <div class="page-header">
      <div class="logo-group">
        <div class="logo-stamp">M</div>
        <h1 class="page-title">Settings</h1>
      </div>
      <p class="page-subtitle">MangaLens&nbsp;·&nbsp;Configuration</p>
    </div>

    <div class="settings-card">
      <!-- API Key Section -->
      <div class="setting-section">
        <div class="section-header">
          <div class="section-num">1</div>
          <div class="section-label">API Key</div>
          <div class="section-jp">認証</div>
        </div>
        <div class="field">
          <label for="apiKey">Moonshot API Key</label>
          <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
          <p class="field-hint">Get your key at <a href="https://platform.moonshot.ai/console/api-keys" target="_blank">platform.moonshot.ai</a></p>
        </div>
      </div>

      <!-- Language Section -->
      <div class="setting-section">
        <div class="section-header">
          <div class="section-num">2</div>
          <div class="section-label">Language</div>
          <div class="section-jp">言語</div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="sourceLang">Source</label>
            <select id="sourceLang">
              <option value="auto">Auto-detect</option>
              <option value="zh">Chinese</option>
              <option value="ko">Korean</option>
              <option value="ja">Japanese</option>
            </select>
          </div>
          <div class="field">
            <label for="targetLang">Target</label>
            <select id="targetLang">
              <option value="en">English</option>
              <option value="zh">Chinese</option>
              <option value="ko">Korean</option>
              <option value="ja">Japanese</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Display Section -->
      <div class="setting-section">
        <div class="section-header">
          <div class="section-num">3</div>
          <div class="section-label">Display</div>
          <div class="section-jp">表示</div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="overlayStyle">Overlay Style</label>
            <select id="overlayStyle">
              <option value="bubble">Speech Bubble</option>
              <option value="pill">Pill Badge</option>
              <option value="box">Solid Box</option>
            </select>
          </div>
          <div class="field">
            <label for="fontSize">Font Size</label>
            <select id="fontSize">
              <option value="small">Small</option>
              <option value="medium" selected>Medium</option>
              <option value="large">Large</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Save -->
      <div class="save-section">
        <button class="btn-save" id="saveBtn">Save</button>
        <div class="saved-toast" id="savedMsg">
          <span class="check-mark">✓</span>
          Saved
        </div>
      </div>
    </div>

    <div class="page-footer">
      MangaLens <span>//</span> v1.0.0
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
