<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      background: #08080c;
      color: #e8e4df;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Screen-tone dot texture ──────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(200,190,180,0.025) 1px, transparent 1px);
      background-size: 3px 3px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Decorative background speed lines ────────────────── */
    .bg-lines {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .bg-lines::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 400px;
      height: 200%;
      background: repeating-linear-gradient(
        15deg,
        transparent,
        transparent 40px,
        rgba(194, 59, 34, 0.015) 40px,
        rgba(194, 59, 34, 0.015) 41px
      );
    }

    .bg-lines::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 300px;
      height: 180%;
      background: repeating-linear-gradient(
        -25deg,
        transparent,
        transparent 60px,
        rgba(212, 168, 83, 0.01) 60px,
        rgba(212, 168, 83, 0.01) 61px
      );
    }

    /* ── Layout ───────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 80px;
      min-height: 100vh;
    }

    /* ── Header section ───────────────────────────────────── */
    .page-header {
      text-align: center;
      margin-bottom: 48px;
      position: relative;
    }

    .page-header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 3px;
      background: #c23b22;
    }

    .logo-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .logo-stamp {
      width: 52px;
      height: 52px;
      background: #c23b22;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Shrikhand', serif;
      font-size: 26px;
      color: #fff;
      transform: rotate(-4deg);
      clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
      flex-shrink: 0;
    }

    .page-title {
      font-family: 'Shrikhand', serif;
      font-size: 32px;
      font-weight: 400;
      color: #e8e4df;
      letter-spacing: 2px;
    }

    .page-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #4a4a58;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── Settings card ────────────────────────────────────── */
    .settings-card {
      background: #0e0e16;
      border: 1px solid #1a1a24;
      max-width: 520px;
      width: 100%;
      position: relative;
    }

    /* Manga panel corner brackets */
    .settings-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 24px;
      height: 24px;
      border-top: 2px solid #c23b22;
      border-left: 2px solid #c23b22;
    }

    .settings-card::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 24px;
      height: 24px;
      border-bottom: 2px solid #c23b22;
      border-right: 2px solid #c23b22;
    }

    /* ── Section styling ──────────────────────────────────── */
    .setting-section {
      padding: 28px 32px;
      border-bottom: 1px solid #141420;
    }

    .setting-section:last-child {
      border-bottom: none;
      padding-bottom: 32px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .section-icon {
      width: 28px;
      height: 28px;
      background: #111118;
      border: 1px solid #1e1e2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .section-label {
      font-family: 'Shrikhand', serif;
      font-size: 15px;
      color: #d4a853;
      letter-spacing: 1px;
    }

    /* ── Form fields ──────────────────────────────────────── */
    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #5a5a68;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    input[type="password"], select {
      width: 100%;
      padding: 11px 14px;
      background: #0a0a10;
      border: 1px solid #1e1e2a;
      color: #e8e4df;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 13px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="password"]:focus, select:focus {
      border-color: #c23b22;
      box-shadow: 0 0 0 1px rgba(194, 59, 34, 0.15);
    }

    input[type="password"]::placeholder {
      color: #2a2a36;
    }

    select {
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a5a68' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 32px;
    }

    select option {
      background: #0e0e16;
      color: #e8e4df;
    }

    .field-hint {
      font-size: 11px;
      color: #3a3a48;
      margin-top: 6px;
      line-height: 1.5;
    }

    .field-hint a {
      color: #c23b22;
      text-decoration: none;
      border-bottom: 1px solid rgba(194, 59, 34, 0.3);
      transition: border-color 0.2s;
    }

    .field-hint a:hover {
      border-color: #c23b22;
    }

    /* ── Save button ──────────────────────────────────────── */
    .save-section {
      padding: 24px 32px;
      background: #0b0b12;
      border-top: 1px solid #141420;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-save {
      padding: 12px 32px;
      background: #c23b22;
      color: #fff;
      border: none;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      clip-path: polygon(0 0, calc(100% - 4px) 0, 100% 4px, 100% 100%, 4px 100%, 0 calc(100% - 4px));
    }

    .btn-save:hover {
      background: #d44429;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(194, 59, 34, 0.3);
    }

    .btn-save:active {
      transform: translateY(0);
    }

    /* ── Saved toast ──────────────────────────────────────── */
    .saved-toast {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #22c55e;
      letter-spacing: 0.5px;
    }

    .saved-toast.show {
      display: flex;
      animation: toastIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .saved-toast .check-mark {
      width: 16px;
      height: 16px;
      background: rgba(34, 197, 94, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    /* ── Footer ───────────────────────────────────────────── */
    .page-footer {
      margin-top: 40px;
      text-align: center;
      color: #2a2a36;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .page-footer span {
      color: #3a3a48;
    }

    /* ── Ink decoration ───────────────────────────────────── */
    .ink-decoration {
      position: fixed;
      bottom: -40px;
      right: -20px;
      width: 200px;
      height: 200px;
      opacity: 0.015;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Page load animation ──────────────────────────────── */
    .page-header {
      animation: fadeIn 0.5s ease;
    }

    .settings-card {
      animation: cardIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.15s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="bg-lines"></div>

  <div class="page">
    <div class="page-header">
      <div class="logo-group">
        <div class="logo-stamp">M</div>
        <h1 class="page-title">Settings</h1>
      </div>
      <p class="page-subtitle">MangaLens Configuration</p>
    </div>

    <div class="settings-card">
      <!-- API Key Section -->
      <div class="setting-section">
        <div class="section-header">
          <div class="section-icon">🔑</div>
          <div class="section-label">API</div>
        </div>
        <div class="field">
          <label for="apiKey">Moonshot API Key</label>
          <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
          <p class="field-hint">Get your key at <a href="https://platform.moonshot.ai/console/api-keys" target="_blank">platform.moonshot.ai</a></p>
        </div>
      </div>

      <!-- Language Section -->
      <div class="setting-section">
        <div class="section-header">
          <div class="section-icon">🌍</div>
          <div class="section-label">Language</div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="sourceLang">Source</label>
            <select id="sourceLang">
              <option value="auto">Auto-detect</option>
              <option value="zh">Chinese</option>
              <option value="ko">Korean</option>
              <option value="ja">Japanese</option>
            </select>
          </div>
          <div class="field">
            <label for="targetLang">Target</label>
            <select id="targetLang">
              <option value="en">English</option>
              <option value="zh">Chinese</option>
              <option value="ko">Korean</option>
              <option value="ja">Japanese</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Display Section -->
      <div class="setting-section">
        <div class="section-header">
          <div class="section-icon">💬</div>
          <div class="section-label">Display</div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="overlayStyle">Overlay Style</label>
            <select id="overlayStyle">
              <option value="bubble">Speech Bubble</option>
              <option value="pill">Pill Badge</option>
              <option value="box">Solid Box</option>
            </select>
          </div>
          <div class="field">
            <label for="fontSize">Font Size</label>
            <select id="fontSize">
              <option value="small">Small</option>
              <option value="medium" selected>Medium</option>
              <option value="large">Large</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Save -->
      <div class="save-section">
        <button class="btn-save" id="saveBtn">Save Settings</button>
        <div class="saved-toast" id="savedMsg">
          <span class="check-mark">✓</span>
          Saved
        </div>
      </div>
    </div>

    <div class="page-footer">
      MANGALENS <span>·</span> v1.0.0
    </div>
  </div>

  <!-- Decorative ink splash -->
  <svg class="ink-decoration" viewBox="0 0 200 200">
    <circle cx="80" cy="100" r="40" fill="currentColor"/>
    <circle cx="130" cy="70" r="22" fill="currentColor"/>
    <circle cx="110" cy="140" r="18" fill="currentColor"/>
    <circle cx="155" cy="110" r="12" fill="currentColor"/>
    <circle cx="60" cy="60" r="8" fill="currentColor"/>
    <circle cx="150" cy="150" r="10" fill="currentColor"/>
    <ellipse cx="140" cy="155" rx="14" ry="6" fill="currentColor" transform="rotate(25 140 155)"/>
    <circle cx="65" cy="130" r="6" fill="currentColor"/>
  </svg>

  <script src="settings.js"></script>
</body>
</html>
